train_batch_size: 64
test_batch_size: 64
img_size: 256
num_epochs: 10
num_workers: 2
hydra_output_dir: outputs
num_classes: 6
norm_mean: [0.5, 0.5, 0.5]
norm_std: [0.5, 0.5, 0.5]

optimizer:
  _target_: torch.optim.Adam
  lr: 1e-4
  betas: [0.9, 0.999]

metric:
  _target_: torchmetrics.Accuracy
  task: multiclass

criterion:
  _target_: torch.nn.CrossEntropyLoss
